[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rhizome"
version = "0.1.0"
description = "Semantic backlinks for your notes — generated locally, stored as [[wikilinks]]"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Matías Leonel Zalazar", email = "matias.zalazar@icloud.com" },
]
dependencies = [
    "onnxruntime>=1.24.3",
    "tokenizers>=0.23.1",
    "requests>=2.33.1",
    "numpy>=1.26.0",
    "hnswlib>=0.8.0",
    "loguru>=0.7.3",
    "typer>=0.25.1",
    "python-dotenv>=1.2.2",
    "pydantic-settings>=2.14.1",
]

[project.scripts]
rhizome = "rhizome.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rhizome"]

[tool.hatch.build]
sources = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
